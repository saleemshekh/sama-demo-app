<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAB - Pre-Login Security Check</title>
<style>
  body{font-family:Segoe UI,Tahoma;background:#f5f5f5;margin:0;padding:20px;}
.card{max-width:500px;margin:60px auto;background:white;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);position:relative;}
.warning{background:#fff3cd;border:2px solid #ffc107;padding:15px;border-radius:8px;margin-top:15px;color:#856404;line-height:1.6;}
.success{background:#d4edda;border:2px solid #28a745;padding:15px;border-radius:8px;color:#155724;margin-top:15px;}
.danger{background:#f8d7da;border:2px solid #dc3545;padding:15px;border-radius:8px;color:#721c24;margin-top:15px;}
.btn-login{width:100%;padding:14px;background:#004D40;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;margin-top:15px;cursor:pointer;}
.lang-switch{position:absolute;top:15px;right:15px;}
.lang-switch button{padding:6px 14px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;}
.active-lang{background:#004D40!important;color:white!important;}
.inactive-lang{background:#eee!important;color:#333!important;}
  #status{min-height:40px;font-size:14px;margin-top:20px;}
  #warningBox{min-height:140px;}
</style>
</head>
<body>
<div class="card">
  <div class="lang-switch">
    <button id="btnEN" onclick="setLang('en')" class="active-lang">EN</button>
    <button id="btnAR" onclick="setLang('ar')" class="inactive-lang">العربية</button>
  </div>
  <h2 style="color:#004D40;margin-top:40px;" id="title">SAB - Saudi Awwal Bank</h2>
  <p id="status">📡 Verifying location...</p>
  <div id="warningBox"></div>
  <button id="loginBtn" class="btn-login" style="display:none;" onclick="goDashboard()">Continue</button>
  <button id="retryBtn" class="btn-login" style="display:none;background:#ff9800;" onclick="location.reload()">🔄 Retry - Allow Location</button>
</div>

<script>
const i18n = {
  en: { title:"SAB - Saudi Awwal Bank", verifying:"📡 Verifying location... tap Allow", location:"🌍 Location:", accuracy:"Accuracy:", mockDetected:"Mock Location Detected", clean:"Clean Location", detectedAt:"Detected at:", risk:"Risk Score:", allowed:"Allowed:", warningTitle:"⚠️ SECURITY WARNING - PRE-LOGIN", preOnly:"Pre-Login Warning - No Amount Impact", instruction:"Please disable mock location from Developer Options.", continueBtn:"⚠️ Continue to Login with Security Warning", continueClean:"✅ Continue to Secure Login", noImpact:"SAMA Compliant", perm:"❌ Location Blocked - Please Allow Location permission from browser lock icon and turn ON GPS" },
  ar: { title:"SAB - البنك السعودي الأول", verifying:"📡 جاري التحقق - الرجاء السماح", location:"🌍 الموقع:", accuracy:"الدقة:", mockDetected:"تم اكتشاف موقع وهمي", clean:"موقع نظيف", detectedAt:"تم الكشف في:", risk:"درجة المخاطر:", allowed:"مسموح:", warningTitle:"⚠️ تحذير أمني", preOnly:"تحذير قبل تسجيل الدخول", instruction:"الرجاء تعطيل الموقع الوهمي.", continueBtn:"⚠️ المتابعة مع تحذير", continueClean:"✅ المتابعة الآمنة", noImpact:"متوافق مع ساما", perm:"❌ الموقع محظور - الرجاء السماح من أيقونة القفل" }
};

let currentLang = localStorage.getItem('sama_lang') || 'en';
let lastData = null;

async function getCityCountry(lat, lon){
  try{
    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${currentLang}`);
    const data = await res.json();
    return `${data.city || data.locality || ''}, ${data.countryName || ''}`.trim() || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  }catch(e){ return `${lat.toFixed(4)}, ${lon.toFixed(4)}`; }
}

function checkGPS(){
  const t = i18n[currentLang];
  document.getElementById('status').innerText = t.verifying;
  document.getElementById('retryBtn').style.display = 'none';

  // Force prompt in 1 sec
  setTimeout(()=>{
    if(document.getElementById('status').innerText.includes('Verifying') || document.getElementById('status').innerText.includes('جاري')){
      document.getElementById('status').innerHTML = t.perm;
      document.getElementById('retryBtn').style.display = 'block';
    }
  }, 6000);

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const acc = Math.round(pos.coords.accuracy);

    // TURANT dikhao - city ka wait mat karo
    const isInSaudi = (lat >= 16.3 && lat <= 32.1 && lon >= 34.5 && lon <= 55.6);
    let isMock = false; let risk = 100; let reason = "";
    if(acc <= 2){ isMock=true; risk=960; reason=`Perfect ${acc}m = 100% Mock`; }
    else if(!isInSaudi && acc <= 15){ isMock=true; risk=960; reason=`Foreign ${acc}m = Mock`; }
    else { isMock=false; risk=100; reason=`Clean - ${acc}m`; }

    lastData = {lat, lon, acc, city: `${lat.toFixed(4)}, ${lon.toFixed(4)}`, isMock, reason, risk, isInSaudi};
    renderUI(lastData);

    // City baad me update karo
    const city = await getCityCountry(lat, lon);
    lastData.city = city;
    if(!isInSaudi){ lastData.reason = `Foreign ${city} - ${acc}m = Mock`; }
    else { lastData.reason = `Clean - ${city} - ${acc}m`; }
    renderUI(lastData);

  }, (err) => {
    document.getElementById('status').innerHTML = i18n[currentLang].perm + `<br><small>Error Code: ${err.code} - ${err.message}</small>`;
    document.getElementById('warningBox').innerHTML = `<div class="danger">Go to: Chrome > Lock Icon > Site Settings > Location > Allow<br>And turn ON phone GPS</div>`;
    document.getElementById('retryBtn').style.display = 'block';
  }, {enableHighAccuracy:false, maximumAge:30000, timeout:10000});
}

function renderUI(d){
  const t = i18n[currentLang];
  const time = new Date().toLocaleTimeString();
  document.getElementById('title').innerText = t.title;
  document.getElementById('status').innerHTML = `${t.location} ${d.city}<br>${t.accuracy} ${d.acc}m - ${time}`;
  const warningBox = document.getElementById('warningBox');
  const loginBtn = document.getElementById('loginBtn');
  if(d.isMock){
    warningBox.innerHTML = `<div class="warning"><b>${t.warningTitle}</b><br>${t.mockDetected} - ${d.reason}<br>${t.risk} ${d.risk} - ${t.allowed} False<br><small>${t.preOnly}</small><br><br>${t.instruction}</div>`;
    loginBtn.innerText = t.continueBtn;
  } else {
    warningBox.innerHTML = `<div class="success">✅ ${t.clean} - ${d.city} - ${t.risk} ${d.risk} - All Allowed</div>`;
    loginBtn.innerText = t.continueClean;
  }
  loginBtn.style.display = 'block';
  document.getElementById('retryBtn').style.display = 'none';
  localStorage.setItem('sama_last_detection', JSON.stringify(d));
}

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('sama_lang', lang);
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  document.getElementById('btnEN').className = lang==='en'?'active-lang':'inactive-lang';
  document.getElementById('btnAR').className = lang==='ar'?'active-lang':'inactive-lang';
  if(lastData){ getCityCountry(lastData.lat, lastData.lon).then(c=>{ lastData.city=c; renderUI(lastData); }); }
}

function goDashboard(){ location.href='dashboard.html'; }
setLang(currentLang);
checkGPS();
</script>
</body>
</html>
