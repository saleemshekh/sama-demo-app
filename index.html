<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMA - ANY COUNTRY FAKE BLOCK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h2 id="title">Checking GPS...</h2>
<div id="a" style="padding:15px;border-radius:10px;background:#fff3e0;">📡 Checking LIVE...</div>
<br>
<div id="b" style="padding:15px;border-radius:10px;">💰 SAR 50,000</div>
</div>
<script>
function showFake(lat,lon,acc,reason){
 document.getElementById("title").innerHTML="🚫 FAKE DETECTED - SAMA BLOCK";
 document.getElementById("a").innerHTML=`❌ FAKE GPS DETECTED<br>${lat.toFixed(4)}, ${lon.toFixed(4)} Acc:${acc}m<br>Reason: ${reason}<br><b>Risk:960 Allowed:false</b><br>🚫 SAMA BLOCK - Any Country`;
 document.getElementById("a").style.background="#ffebee"; document.getElementById("a").style.border="2px solid red";
 document.getElementById("b").innerHTML=`💰 SAR 50,000<br>🚫 BLOCKED - Fake GPS ON hai<br>Risk:960<br>Country koi bhi ho - BLOCK`;
 document.getElementById("b").style.background="#ffcdd2";
}
function showReal(lat,lon,acc){
 document.getElementById("title").innerHTML="✅ SAMA PASS - REAL";
 document.getElementById("a").innerHTML=`✅ LIVE REAL: ${lat.toFixed(4)}, ${lon.toFixed(4)} Acc:${acc}m<br>✅ REAL Location - Riyadh<br>Risk:100 Acc:${acc} Allowed:true - SAMA PASS`;
 document.getElementById("a").style.background="#e8f5e9"; document.getElementById("a").style.border="2px solid green";
 document.getElementById("b").innerHTML=`💰 SAR 50,000<br>✅ ALLOWED - Real GPS<br>Risk:100 Acc:${acc}`;
}
navigator.geolocation.getCurrentPosition(p=>{
 let lat=p.coords.latitude, lon=p.coords.longitude, acc=Math.round(p.coords.accuracy);
 let alt=p.coords.altitude, speed=p.coords.speed;
 
 // ANY COUNTRY FAKE DETECTION - SAMA RULE
 let isFake = false, reason="";
 if(acc<=5){ isFake=true; reason=`Acc too low (${acc}m) - Fake app`; }
 else if(acc==0){ isFake=true; reason=`Acc 0 - Mock`; }
 else if(alt===null && speed===null && acc<10){ isFake=true; reason=`No altitude/speed + low Acc`; }
 // Add more: if you want strict
 // if(acc<12 && acc>0){ isFake=true; reason=`Suspicious Acc ${acc}`; }

 if(isFake) showFake(lat,lon,acc,reason);
 else showReal(lat,lon,acc);
}, e=>{document.getElementById("a").innerHTML="❌ Allow Location: "+e.message;}, {enableHighAccuracy:true,timeout:10000,maximumAge:0});
</script>
</body>
</html>
