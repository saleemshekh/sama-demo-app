<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMA Secure - Pre-Login Security Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h2>🇸🇦 SAMA Secure - Pre-Login</h2>
<div id="live-box" style="padding:15px; border-radius:10px; background:#fff3e0; border:2px solid orange;">
📡 Verifying Location Security...
</div>
<br>
<div id="warning-box" style="display:none; padding:12px; background:#fff8e1; border:2px solid #ffc107; border-radius:8px; color:#856404;"></div>
<br>
<button onclick="location.href='dashboard.html'" id="goBtn" style="padding:12px; background:black; color:white; width:100%; border-radius:8px; font-size:16px; display:none;">➡️ Continue to Dashboard</button>
<div style="font-size:11px;color:#888;margin-top:10px;text-align:center;">Continuous Monitoring: Active | Auto-Refresh: 3s | Performance Impact: None</div>
</div>
<script>
function showWarningFake(lat,lon,acc,reason){
 const box=document.getElementById("live-box");
 box.style.background="#fff3e0"; box.style.border="2px solid #ff9800";
 box.innerHTML=`⚠️ <b>SAMA WARNING: Suspicious Location Detected - Pre-Login</b><br>📍 Location: ${lat.toFixed(4)}, ${lon.toFixed(4)} Accuracy:${acc}m<br>Reason: ${reason}<br><b>Risk Score: 960 - Pre-Login Warning</b><br>Country Independent Detection<br><small>${new Date().toLocaleTimeString()} - Auto Detected</small>`;
 document.getElementById("warning-box").style.display="block";
 document.getElementById("warning-box").innerHTML=`⚠️ <b>SECURITY WARNING - PRE-LOGIN</b><br>Mock Location Detected (Accuracy:${acc}m - ${reason})<br>Please disable mock location applications to proceed securely.<br>Post-Login transactions will be BLOCKED - SAR 50,000<br>Risk Score: 960 - SAMA Compliant Warning`;
 const b=document.getElementById("goBtn"); b.style.display="block"; b.style.background="#ff9800"; b.innerText="⚠️ Proceed with Warning to Dashboard (Will be BLOCKED)";
}
function showReal(lat,lon,acc){
 const box=document.getElementById("live-box");
 box.style.background="#e8f5e9"; box.style.border="2px solid green";
 box.innerHTML=`📡 LIVE Location: ${lat.toFixed(4)}, ${lon.toFixed(4)} Accuracy:${acc}m<br>✅ Verified Real Location - Riyadh<br><b>Risk Score: 100 - Allowed: True</b><br>${new Date().toLocaleTimeString()} - SAMA PASS - Verified`;
 document.getElementById("warning-box").style.display="none";
 const btn=document.getElementById("goBtn"); btn.style.display="block"; btn.style.background="green"; btn.innerText="✅ Proceed to Dashboard - Verification PASSED";
}
function checkGPS(){
  navigator.geolocation.getCurrentPosition(pos=>{
   const lat=pos.coords.latitude, lon=pos.coords.longitude;
   const acc=Math.round(pos.coords.accuracy);
   const alt=pos.coords.altitude, speed=pos.coords.speed;
   let isFake=false, reason="";
   if(acc<=5){ isFake=true; reason=`Abnormally low accuracy (${acc}m) - Mock location suspected`; }
   else if(acc===0){ isFake=true; reason=`Zero accuracy (0m) - Mock location confirmed`; }
   else if(alt===null && speed===null && acc<12){ isFake=true; reason=`Missing altitude/speed data with low accuracy ${acc}m`; }
   if(isFake) showWarningFake(lat,lon,acc,reason); else showReal(lat,lon,acc);
  }, err=>{ document.getElementById("live-box").innerHTML="❌ Location Permission Required: "+err.message; }, {enableHighAccuracy:true, timeout:10000, maximumAge:0});
}
checkGPS();
setInterval(checkGPS, 3000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkGPS(); });
</script>
</body>
</html>
