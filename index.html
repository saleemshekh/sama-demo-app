<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>SAMA Pre-Login Demo - LIVE GPS</title>
<style>
.banner{padding:12px; margin:10px 0; border-radius:8px; display:none; font-weight:bold}
.warn{background:#fff3cd; color:#856404; border:1px solid #ffeeba}
.block{background:#f8d7da; color:#721c24; border:1px solid #f5c6cb}
.toggle{background:#6f42c1; color:white; padding:10px; border:none; border-radius:6px; width:100%; margin-bottom:10px; font-weight:bold}
.tabs button{padding:8px 12px; margin:2px}
.tabs button.active{background:#007bff; color:white}
.screen{border:1px solid #ddd; padding:15px; margin-top:10px; border-radius:8px}
.nextLink{display:block; margin-top:15px; background:#28a745; color:white; padding:12px; text-align:center; text-decoration:none; border-radius:6px; font-weight:bold}
.liveDot{width:10px; height:10px; background:red; border-radius:50%; display:inline-block; animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="container">
  <h2>🇸🇦 SAMA Pre-Login (3 Screens) <span class="liveDot"></span> LIVE</h2>
  <p id="liveLoc" style="font-size:12px; color:green; font-weight:bold">📡 Getting LIVE GPS...</p>
  <button onclick="toggleFakeGPS()" class="toggle">📍 Toggle Fake GPS (Current: <span id="gpsStatus">Loading...</span>)</button>
  <div id="samaBanner" class="banner"></div>

  <div class="tabs">
    <button onclick="showScreen(1)" id="btn1" class="active">1. Splash (SOFT)</button>
    <button onclick="showScreen(2)" id="btn2">2. Login (SOFT)</button>
    <button onclick="showScreen(3)" id="btn3">3. Forgot (HARD)</button>
  </div>

  <div id="screen1" class="screen"> <h3>Screen 1: Splash - SOFT Warning</h3> <p>App start - Background LIVE GPS check...</p> <p id="log1"></p> </div>
  <div id="screen2" class="screen" style="display:none"> <h3>Screen 2: Login - SOFT Warning</h3> <input placeholder="Username"><input type="password" placeholder="Password"><button onclick="goToDashboard()">Login</button> <p id="log2"></p> </div>
  <div id="screen3" class="screen" style="display:none"> <h3>Screen 3: Forgot Password - HARD Block</h3> <p>SAMA Rule: Forgot pe Fake GPS = BLOCK</p><button onclick="testForgot()">Try Reset Password</button> <p id="log3"></p> </div>
  
  <a href="dashboard.html" class="nextLink">➡️ Go to Post-Login (Dashboard + Transfer)</a>
</div>

<script>
// ===== SAMA LIVE GPS LOGIC - MERGED =====
async function getRealGPS() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject("GPS not supported"); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }),
      (err) => reject(err.message),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

async function checkSAMA_PreLogin(screenName, mode) {
  let result = { risk: 100, accuracy: 10, allowed: true, banner: "" };
  let isFakeToggle = localStorage.getItem("FAKE_GPS") === "1";
  let liveText = document.getElementById("liveLoc");
  
  try {
    let gps = await getRealGPS();
    result.accuracy = Math.round(gps.acc);
    let lat = gps.lat;
    let lng = gps.lng;
    
    liveText.innerText = `📡 LIVE: ${lat.toFixed(4)}, ${lng.toFixed(4)} Acc:${result.accuracy}m`;

    if (isFakeToggle) {
      lat = 9.0820; lng = 8.6753; result.accuracy = 0; result.risk = 1110;
      liveText.innerText = `📡 SIMULATED FAKE: ${lat.toFixed(4)}, ${lng.toFixed(4)} (Nigeria) - Demo Mode`;
      if (mode === "HARD") {
        result.allowed = false;
        result.banner = `❌ SAMA BLOCKED (${screenName}): Fake GPS Detected Risk ${result.risk} - Cannot proceed. Disable Fake GPS. Lat:${lat.toFixed(4)}`;
      } else {
        result.banner = `⚠️ SAMA WARNING (${screenName}): Fake GPS Risk ${result.risk} - Lat:${lat.toFixed(4)} Lng:${lng.toFixed(4)} - Login ke baad BLOCK hoga. Acc:${result.accuracy}`;
      }
      return result;
    }
    
    // LIVE REAL CHECK
    if (lat < 15 || lat > 33 || lng < 33 || lng > 56) { result.risk += 500; }
    if (gps.acc === 0 || gps.acc > 100) { result.risk += 1000; }
    
    if (result.risk >= 1000) {
      if (mode === "HARD") {
        result.allowed = false;
        result.banner = `❌ SAMA BLOCKED (${screenName}): Suspicious Location Risk ${result.risk} - Lat:${lat.toFixed(4)}`;
      } else {
        result.banner = `⚠️ SAMA WARNING (${screenName}): Risk ${result.risk} - Lat:${lat.toFixed(4)} Acc:${result.accuracy}`;
      }
    }
  } catch (e) {
    result.banner = `GPS Error: ${e} - Location Permission ON karo`;
    liveText.innerText = `❌ GPS Error: ${e}`;
  }
  return result;
}

function toggleFakeGPS() {
  let current = localStorage.getItem("FAKE_GPS") === "1";
  localStorage.setItem("FAKE_GPS", current ? "0" : "1");
  document.getElementById("gpsStatus").innerText = !current ? "FAKE (Nigeria)" : "REAL (Riyadh - LIVE)";
  let activeBtn = document.querySelector(".tabs .active");
  let n = 1;
  if(activeBtn) n = activeBtn.id === "btn2" ? 2 : activeBtn.id === "btn3" ? 3 : 1;
  showScreen(n);
}

async function showScreen(n){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn"+n).classList.add("active");
  document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
  document.getElementById("screen"+n).style.display="block";
  let mode = n===3 ? "HARD" : "SOFT";
  let name = n===1 ? "Splash" : n===2 ? "Login" : "Forgot";
  document.getElementById("log"+n).innerText = "📡 Checking LIVE GPS...";
  let res = await checkSAMA_PreLogin(name, mode);
  document.getElementById("log"+n).innerText = `Risk:${res.risk} Acc:${res.accuracy} Allowed:${res.allowed}`;
  let b = document.getElementById("samaBanner");
  if(res.banner){ b.innerText=res.banner; b.style.display="block"; b.className = res.allowed ? "banner warn" : "banner block"; }
  else b.style.display="none";
}

function goToDashboard(){ window.location="dashboard.html"; }
async function testForgot(){ let r=await checkSAMA_PreLogin("ForgotPassword","HARD"); if(!r.allowed) alert(r.banner); else alert("Allowed - Real GPS: "+r.accuracy+"m"); }

// Init
document.getElementById("gpsStatus").innerText = localStorage.getItem("FAKE_GPS")==="1" ? "FAKE (Nigeria)" : "REAL (Riyadh - LIVE)";
showScreen(1);
</script>
</body>
</html>
