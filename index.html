<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMA Pre-Login WARNING</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h2>🇸🇦 SAMA Pre-Login</h2>
<div id="live-box" style="padding:15px; border-radius:10px; background:#fff3e0; border:2px solid orange;">
📡 Checking LIVE GPS...
</div>
<br>
<div id="warning-box" style="display:none; padding:12px; background:#fff8e1; border:2px solid #ffc107; border-radius:8px; color:#856404;">
⚠️ <b>WARNING: Fake GPS Detected</b><br>
Please disable Mock Location to continue securely.<br>
SAMA Pre-Login Warning - Country koi bhi ho
</div>
<br>
<button onclick="location.href='dashboard.html'" id="goBtn" style="padding:12px; background:black; color:white; width:100%; border-radius:8px; font-size:16px; display:none;">➡️ Continue to Login</button>
</div>
<script>
function showWarningFake(lat,lon,acc,reason){
 const box=document.getElementById("live-box");
 box.style.background="#fff3e0"; box.style.border="2px solid #ff9800";
 box.innerHTML=`
  ⚠️ <b>WARNING: Fake GPS Detected - Pre-Login</b><br>
  📍 ${lat.toFixed(4)}, ${lon.toFixed(4)} Acc:${acc}m<br>
  Reason: ${reason}<br>
  <b>Risk:960 - Pre-Login WARNING</b><br>
  Country koi bhi ho - Warning
 `;
 document.getElementById("warning-box").style.display="block";
 document.getElementById("warning-box").innerHTML=`
  ⚠️ <b>PRE-LOGIN WARNING</b><br>
  Fake GPS ON hai (Acc:${acc}m - ${reason})<br>
  Please OFF karo Mock Location<br>
  Post-Login pe BLOCK hoga - SAR 50,000<br>
  Risk:960 - SAMA Warning
 `;
 document.getElementById("goBtn").style.display="block";
 document.getElementById("goBtn").style.background="#ff9800";
 document.getElementById("goBtn").innerText="⚠️ Continue with WARNING -> Dashboard (will BLOCK)";
}
function showReal(lat,lon,acc){
 const box=document.getElementById("live-box");
 box.style.background="#e8f5e9"; box.style.border="2px solid green";
 box.innerHTML=`
  📡 LIVE: ${lat.toFixed(4)}, ${lon.toFixed(4)} Acc:${acc}m<br>
  ✅ REAL Location - Riyadh - No Warning<br>
  <b>Risk:100 Acc:${acc} Allowed:true</b><br>
  ${new Date().toLocaleTimeString()} - SAMA PASS
 `;
 document.getElementById("warning-box").style.display="none";
 const btn=document.getElementById("goBtn");
 btn.style.display="block"; btn.style.background="green";
 btn.innerText="✅ Go to Dashboard - REAL PASS";
}
navigator.geolocation.getCurrentPosition(pos=>{
 const lat=pos.coords.latitude, lon=pos.coords.longitude;
 const acc=Math.round(pos.coords.accuracy);
 const alt=pos.coords.altitude, speed=pos.coords.speed;
 let isFake=false, reason="";
 if(acc<=5){ isFake=true; reason=`Acc too low (${acc}m) - Fake app`; }
 else if(acc===0){ isFake=true; reason=`Acc 0m - Mock`; }
 else if(alt===null && speed===null && acc<12){ isFake=true; reason=`No altitude/speed + Acc ${acc}m`; }
 if(isFake) showWarningFake(lat,lon,acc,reason);
 else showReal(lat,lon,acc);
}, err=>{
 document.getElementById("live-box").innerHTML="❌ Allow Location: "+err.message;
}, {enableHighAccuracy:true, timeout:10000, maximumAge:0});
</script>
</body>
</html>
