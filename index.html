<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAB - Saudi Awwal Bank</title>
<style>
body{font-family:Segoe UI;background:#f5f5f5;margin:0;padding:20px;}
.card{max-width:500px;margin:60px auto;background:white;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);position:relative;min-height:220px;}
.success{background:#d4edda;border:2px solid #28a745;padding:15px;border-radius:8px;color:#155724;margin-top:15px;line-height:1.5;}
.warning{background:#fff3cd;border:2px solid #ffc107;padding:15px;border-radius:8px;margin-top:15px;color:#856404;line-height:1.5;}
.btn{width:100%;padding:14px;background:#004D40;color:white;border:none;border-radius:8px;font-weight:bold;margin-top:15px;}
.lang{position:absolute;top:15px;right:15px;display:flex;gap:5px;}
.lang button{padding:6px 14px;border:none;border-radius:5px;font-weight:bold;}
.active{background:#004D40!important;color:white!important;}
.inactive{background:#eee!important;color:#333!important;}
.live-badge{font-size:11px;color:#28a745;background:#e8f5e9;padding:3px 8px;border-radius:10px;margin-left:8px;display:inline-block;vertical-align:middle;}
.status-line{min-height:48px;}
</style>
</head>
<body>
<div class="card">
<div class="lang"><button id="btnEN" onclick="setLang('en')" class="active">EN</button><button id="btnAR" onclick="setLang('ar')" class="inactive">العربية</button></div>
<h2 style="color:#004D40;margin-top:40px;" id="title">SAB - Saudi Awwal Bank</h2>
<p id="status" class="status-line">📡 Checking...</p>
<div id="box"></div>
<button id="loginBtn" class="btn" style="display:none;" onclick="location.href='dashboard.html'">Continue</button>
<button id="retryBtn" class="btn" style="display:none;background:#ff9800;" onclick="location.reload()">🔄 Retry - Allow Location</button>
</div>
<script>
const i18n={en:{title:"SAB - Saudi Awwal Bank",location:"🌍 Location:",accuracy:"Accuracy:",clean:"Clean location",risk:"Risk level:",all:"All Allowed - SAMA Compliant",mock:"Mock Location Detected",warn:"⚠️ SECURITY WARNING",perm:"❌ Location Blocked - Click 🔒 > Allow & GPS ON",btnClean:"✅ Safe follow-up",btnMock:"⚠️ Continue with Warning",live:"LIVE AUTO"},ar:{title:"SAB - البنك السعودي الأول",location:"🌍 الموقع:",accuracy:"الدقة:",clean:"موقع نظيف",risk:"مستوى المخاطر:",all:"مسموح بالكامل - متوافق مع ساما",mock:"تم اكتشاف موقع وهمي",warn:"⚠️ تحذير أمني",perm:"❌ الموقع محظور - اضغط 🔒 واسمح",btnClean:"✅ متابعة آمنة",btnMock:"⚠️ المتابعة مع تحذير",live:"مباشر"}};
let currentLang=localStorage.getItem('sama_lang')||'en',lastData=null,timer=null,watchId=null,lastLat=0,lastLon=0;
async function getCity(lat,lon){try{let r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${currentLang}`);let d=await r.json();return `${d.city||d.locality||''}, ${d.countryName||''}`.trim()||`${lat.toFixed(4)}, ${lon.toFixed(4)}`;}catch(e){return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;}}
function startLive(){
  let t=i18n[currentLang];
  document.getElementById('status').innerHTML=`📡 ${t.location} Checking... <span class="live-badge">● ${t.live}</span>`;
  if(timer)clearTimeout(timer);
  if(watchId)navigator.geolocation.clearWatch(watchId);
  timer=setTimeout(()=>{if(!lastData){document.getElementById('status').innerHTML=`${i18n[currentLang].perm} <span class="live-badge">● ${t.live}</span>`;document.getElementById('retryBtn').style.display='block';}},7000);
  watchId=navigator.geolocation.watchPosition(async pos=>{
    clearTimeout(timer);
    let lat=pos.coords.latitude,lon=pos.coords.longitude,acc=Math.round(pos.coords.accuracy);
    // SHAKE FIX - Agar location 5 meter se kam hila to render mat karo
    if(Math.abs(lat-lastLat)<0.00005 && Math.abs(lon-lastLon)<0.00005 && lastData) return;
    lastLat=lat;lastLon=lon;
    let inSaudi=(lat>=16.3&&lat<=32.1&&lon>=34.5&&lon<=55.6);
    let isMock=false,risk=100;
    if(acc<=2){isMock=true;risk=960;}else if(!inSaudi&&acc<=15){isMock=true;risk=960;}
    if(!lastData) lastData={lat,lon,acc,city:`${lat.toFixed(4)}, ${lon.toFixed(4)}`,isMock,risk};
    else{lastData.lat=lat;lastData.lon=lon;lastData.acc=acc;lastData.isMock=isMock;lastData.risk=risk;}
    render(lastData);
    localStorage.setItem('sama_last_detection',JSON.stringify(lastData));
    let city=await getCity(lat,lon);
    lastData.city=city;
    render(lastData);
    localStorage.setItem('sama_last_detection',JSON.stringify(lastData));
  },err=>{
    clearTimeout(timer);
    document.getElementById('status').innerHTML=`${i18n[currentLang].perm}<br><small>${err.message}</small> <span class="live-badge">● ${i18n[currentLang].live}</span>`;
    document.getElementById('retryBtn').style.display='block';
  },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
function render(d){
  let t=i18n[currentLang];
  document.getElementById('title').innerText=t.title;
  document.getElementById('status').innerHTML=`${t.location} ${d.city}<br>${t.accuracy} ${d.acc}m <span class="live-badge">● ${t.live}</span>`;
  let box=document.getElementById('box'),btn=document.getElementById('loginBtn');
  if(d.isMock){
    box.innerHTML=`<div class="warning"><b>${t.warn}</b><br>${t.mock} - ${d.city}<br>${t.risk} ${d.risk} - Blocked</div>`;
    btn.innerText=t.btnMock;
  }else{
    box.innerHTML=`<div class="success">✅ ${t.clean} - ${d.city} - ${t.risk} ${d.risk} - ${t.all}</div>`;
    btn.innerText=t.btnClean;
  }
  btn.style.display='block';
}
function setLang(l){
  currentLang=l;localStorage.setItem('sama_lang',l);
  document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.getElementById('btnEN').className=l==='en'?'active':'inactive';
  document.getElementById('btnAR').className=l==='ar'?'active':'inactive';
  if(lastData){getCity(lastData.lat,lastData.lon).then(c=>{lastData.city=c;render(lastData);});}else{startLive();}
}
setLang(currentLang);
startLive();
</script>
</body>
</html>
