<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMA Secure - Post-Login Security Block</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h2>💰 Post-Login - SAR 50,000 Transfer</h2>
<div id="post-box" style="padding:15px; border-radius:10px; background:#fff3e0; border:2px solid orange;">
📡 Verifying Post-Login Location Security...
</div>
<br>
<div id="transfer-box" style="padding:20px; border-radius:10px; text-align:center; font-size:18px; font-weight:bold;">
Verifying...
</div>
<br>
<button onclick="location.href='index.html'" style="padding:12px; background:#333; color:white; width:100%; border-radius:8px; font-size:16px;">
⬅️ Back to Pre-Login Security Check
</button>
<br><br>
<button onclick="checkGPS()" style="padding:10px; background:white; color:#333; width:100%; border:1px solid #ccc; border-radius:8px; font-size:14px;">
🔄 Re-Verify Location
</button>
<div style="font-size:11px;color:#888;margin-top:10px;text-align:center;">Continuous Monitoring: Active | Auto-Refresh: 3s | No Impact | SAMA CSF Compliant</div>
</div>
<script>
function showBlock(lat,lon,acc,reason){
 document.getElementById("post-box").style.background="#ffebee";
 document.getElementById("post-box").style.border="2px solid red";
 document.getElementById("post-box").innerHTML=`
  🚫 <b>POST-LOGIN SECURITY BLOCK - SPOOFED LOCATION DETECTED</b><br>
  📍 Location: ${lat.toFixed(4)}, ${lon.toFixed(4)} Accuracy:${acc}m<br>
  Reason: ${reason}<br>
  <b>Risk Score: 960 - Allowed: False</b><br>
  SAMA CSF - Transaction Blocked - Country Independent<br>
  <small>${new Date().toLocaleTimeString()} - Auto Detected</small>
 `;
 const t=document.getElementById("transfer-box");
 t.style.background="#ffcdd2"; t.style.color="red"; t.style.border="2px solid red";
 t.innerHTML=`
  💰 SAR 50,000<br><br>
  🚫 TRANSACTION BLOCKED<br>
  Mock Location Detected - Risk Mitigation Active<br>
  Risk Score: 960<br>
  <span style="font-size:14px;">Please disable mock location to proceed - SAMA Security Policy</span>
 `;
}
function showAllow(lat,lon,acc){
 document.getElementById("post-box").style.background="#e8f5e9";
 document.getElementById("post-box").style.border="2px solid green";
 document.getElementById("post-box").innerHTML=`
  ✅ LIVE Location Verified: ${lat.toFixed(4)}, ${lon.toFixed(4)} Accuracy:${acc}m<br>
  ✅ Authentic Location - Riyadh - Verified<br>
  <b>Risk Score: 100 - Allowed: True</b><br>
  SAMA CSF - Transaction Allowed - Compliant<br>
  <small>${new Date().toLocaleTimeString()}</small>
 `;
 const t=document.getElementById("transfer-box");
 t.style.background="#c8e6c9"; t.style.color="green"; t.style.border="2px solid green";
 t.innerHTML=`
  💰 SAR 50,000<br><br>
  ✅ TRANSACTION ALLOWED<br>
  Risk Score: 100 Accuracy:${acc}m Allowed: True<br>
  <span style="font-size:14px;">Authentic GPS Verified - SAMA PASS</span>
 `;
}
function checkGPS(){
  navigator.geolocation.getCurrentPosition(pos=>{
   const lat=pos.coords.latitude, lon=pos.coords.longitude;
   const acc=Math.round(pos.coords.accuracy);
   const alt=pos.coords.altitude, speed=pos.coords.speed;
   let isFake=false, reason="";
   if(acc<=5){ isFake=true; reason=`Abnormally low accuracy (${acc}m) - Mock location suspected`; }
   else if(acc===0){ isFake=true; reason=`Zero accuracy (0m) - Mock location confirmed`; }
   else if(alt===null && speed===null && acc<12){ isFake=true; reason=`Missing altitude/speed data with low accuracy ${acc}m`; }
   if(isFake) showBlock(lat,lon,acc,reason);
   else showAllow(lat,lon,acc);
  }, err=>{
   document.getElementById("post-box").innerHTML="❌ GPS Error: "+err.message;
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:0});
}
checkGPS();
setInterval(checkGPS, 3000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkGPS(); });
</script>
</body>
</html>
