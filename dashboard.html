<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>SAB - Dashboard</title>
<style>body{font-family:Segoe UI; background:#f5f5f5; padding:20px;}.card{max-width:600px; margin:40px auto; background:white; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1);}.block{background:#f8d7da; border:2px solid #dc3545; padding:20px; border-radius:10px;}</style>
</head>
<body>
<div class="card">
<h2 style="color:#004D40;">SAB - Secure Dashboard</h2>
<div id="dashBox">Loading...</div>
</div>
<script>
const i18n = {
  en: {
    blockedTitle: "🚫 POST-LOGIN SECURITY BLOCK",
    amount: "Amount: SAR 50,000 BLOCKED",
    reason: "Reason:", risk: "Risk Score:", location: "Location:", status: "Status: Transaction BLOCKED - SAMA Policy",
    instruction: "Disable mock location from Developer Options and retry."
  },
  ar: {
    blockedTitle: "🚫 حظر أمني - بعد تسجيل الدخول",
    amount: "المبلغ: ٥٠٬٠٠٠ ريال محظور",
    reason: "السبب:", risk: "درجة المخاطر:", location: "الموقع:", status: "الحالة: تم حظر المعاملة - سياسة ساما",
    instruction: "قم بتعطيل الموقع الوهمي من خيارات المطور وحاول مرة أخرى."
  }
};
let lang = localStorage.getItem('sama_lang') || 'en';
document.documentElement.lang = lang;
document.documentElement.dir = lang==='ar'? 'rtl' : 'ltr';
const t = i18n[lang];
const d = JSON.parse(localStorage.getItem('sama_last_detection') || '{}');

if(d.isMock){
  document.getElementById('dashBox').innerHTML = `
    <div class="block">
      <h3>${t.blockedTitle}</h3>
      <b style="font-size:18px;">${t.amount}</b><br><br>
      ${t.location} ${d.city || 'Unknown'}<br>
      ${t.reason} ${d.reason}<br>
      ${t.risk} ${d.risk} - Allowed: False<br><br>
      <b>${t.status}</b><br><br>
      ${t.instruction}
    </div>`;
} else {
  document.getElementById('dashBox').innerHTML = `<div style="background:#d4edda; padding:20px; border-radius:10px;">✅ Welcome - Clean Location: ${d.city} - All transactions allowed</div>`;
}
</script>
</body>
</html>
