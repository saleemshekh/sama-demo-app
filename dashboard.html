</head>
<body>
<div class="container">

<div id="a" style="padding:15px;background:#e8f5e9;border:2px solid green;border-radius:10px;">📡 LIVE...</div>

<script>
function ok(p){

 document.getElementById("b").innerHTML=`💰 SAR 50,000<br>✅ Transfer ALLOWED<br>Risk:100 Acc:${acc} Allowed:true<br>Riyadh LIVE - REAL GPS`;
}
function fail(e){
 document.getElementById("a").innerHTML=`❌ Allow Location: Chrome top me 🔒 > Location > Allow > Refresh<br>${e.message}`;
}
navigator.geolocation.getCurrentPosition(ok,fail,{enableHighAccuracy:true,timeout:10000,maximumAge:0});
</script>
